# Aplicación de Argo CD: observa gitops/overlays/produccion en GitHub y mantiene el clúster igual a lo que dice Git.
# selfHeal: si alguien cambia algo a mano en el clúster, Argo CD lo regresa al estado de Git.
# prune: lo que se borra de Git se borra del clúster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cab-chatbot-produccion
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/gagarang25/ProyectoFase3.git
    targetRevision: main
    path: gitops/overlays/produccion
  destination:
    server: https://kubernetes.default.svc
    namespace: cab-produccion
  ignoreDifferences:                 # en producción las réplicas las decide el autoescalado (HPA), no Git
    - group: apps
      kind: Deployment
      jsonPointers: [/spec/replicas]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff: {duration: 10s, factor: 2, maxDuration: 2m}
